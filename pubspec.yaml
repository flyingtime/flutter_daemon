name: flutter_daemon
description: "Android 进程保活插件，封装自 com.coolerfall.daemon。通过独立 daemon 子进程周期性拉起 Service 与应用，实现应用被杀后自恢复。"
version: 0.0.1
homepage:

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

# For information on the generic Dart part of this file, see
# the following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # pluginClass: 在 Android 端注册到 Flutter 引擎的类（MethodChannel 入口）
  # package:     该类所在的 Kotlin 包名
  plugin:
    platforms:
      android:
        package: com.flutter_daemon.flutter_daemon
        pluginClass: FlutterDaemonPlugin
